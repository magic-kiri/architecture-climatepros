<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClimatePros · Stream 1 — Unified Architecture</title>
<link rel="stylesheet" href="sections/style.css">
</head>
<body>
<div class="wrap" id="doc"></div>
<script>
// Thin shell. Section content lives in sections/*.html and loads at runtime,
// so this file stays small and every section is edited in isolation.
// Order below = document order. Add/remove a section by editing this list.
// Requires http(s) (local server or GitHub Pages) — fetch() is blocked on file://.
// For a single self-contained file (openable via file://), run: python3 scripts/build.py
const PARTS = ['_hero','01','02','03','04','05','06','07','08','09','10','11','12'];
const doc = document.getElementById('doc');
(async () => {
  for (const p of PARTS) {
    const res = await fetch('sections/' + p + '.html');
    if (!res.ok) throw new Error(p + '.html → ' + res.status);
    doc.insertAdjacentHTML('beforeend', await res.text());
  }
})().catch(err => {
  doc.innerHTML =
    '<div style="max-width:680px;margin:64px auto;padding:0 24px;font-family:system-ui,-apple-system,sans-serif;line-height:1.6">'
    + '<h1 style="font-size:22px">Serve this over http</h1>'
    + '<p>Sections load via <code>fetch()</code>, which browsers block on <code>file://</code>. '
    + 'From this folder run <code>python3 -m http.server</code> and open '
    + '<code>http://localhost:8000/stream1-unified-architecture.html</code> — or view it on GitHub Pages. '
    + 'For a single self-contained file, run <code>python3 scripts/build.py</code>.</p>'
    + '<p style="color:#94a3b8;font-size:13px">(' + err + ')</p></div>';
});
</script>
</body>
</html>
