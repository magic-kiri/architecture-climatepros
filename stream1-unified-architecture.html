<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClimatePros · Stream 1 — Unified Architecture</title>
<link rel="stylesheet" href="sections/style.css">
</head>
<body>
<div id="nav-slot"></div>
<div class="wrap" id="doc"></div>
<script>
// Thin shell: every section lives in its own sections/*.html and is rendered
// at runtime, so this file stays short and each section is edited in isolation.
// Order below = document order — add/remove a section by editing one list.
// Needs http(s) (local server or GitHub Pages); fetch() is blocked on file://.
// For a single self-contained file that also opens via file://, run:
//   python3 scripts/build.py   → stream1-unified-architecture.bundle.html
const NAV  = ['_nav'];
const BODY = ['_hero','01','02','03','04','05','06','07','08','09','10','11','12'];
async function inject(el, names){
  for (const n of names){
    const r = await fetch('sections/' + n + '.html');
    if (!r.ok) throw new Error(n + '.html → ' + r.status);
    el.insertAdjacentHTML('beforeend', await r.text());
  }
}
(async () => {
  await inject(document.getElementById('nav-slot'), NAV);
  await inject(document.getElementById('doc'), BODY);
  // <script> injected via innerHTML does not auto-run — re-create so it executes
  document.querySelectorAll('#nav-slot script, #doc script').forEach(function(old){
    const s = document.createElement('script');
    s.textContent = old.textContent;
    old.replaceWith(s);
  });
})().catch(function(err){
  document.getElementById('doc').innerHTML =
    '<div style="max-width:680px;margin:64px auto;padding:0 24px;font-family:system-ui,-apple-system,sans-serif;line-height:1.6">'
    + '<h1 style="font-size:22px">Serve this over http</h1>'
    + '<p>Sections load via <code>fetch()</code>, which browsers block on <code>file://</code>. '
    + 'From this folder run <code>python3 -m http.server</code> and open '
    + '<code>http://localhost:8000/stream1-unified-architecture.html</code> — or view it on GitHub Pages. '
    + 'For one self-contained file that opens by double-click, run <code>python3 scripts/build.py</code> '
    + 'and open <code>stream1-unified-architecture.bundle.html</code>.</p>'
    + '<p style="color:#94a3b8;font-size:13px">(' + err + ')</p></div>';
});
</script>
</body>
</html>
