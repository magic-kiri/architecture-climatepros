<!--
  Single source of truth for the unified system diagram (§2a), embedded via <iframe>.
  Cloud split: existing FieldJetX platform + new non-AI infra (message broker, ECS Fargate,
  SNS) stay on AWS, aligned with FieldJetX. Broker is abstract — Redis Streams / Amazon MQ /
  SQS are candidate implementations; contract is publish / consume with consumer groups.
  Only the AI stack (FastAPI AI server, its own MongoDB, vector DB) runs on Azure.
  Models stay on-prem.
  The FastAPI AI server has NO connection to SQL Server — it owns its own MongoDB.
  Reports its height to the host via postMessage.
-->
